<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fortinet Dashboard</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div class="brand">Fortinet Dashboard</div>
  <div class="seg"><button id="tFmg" class="on">FortiManager</button><button id="tFgt">FortiGate</button></div>
  <div class="end"><button class="tool" id="clr" title="Empty the server result cache">Clear cache</button><button class="tool" id="out_">Sign out</button></div>
</header>
<div class="bar">
  <select id="dev" hidden></select>
  <select id="adom" title="ADOM"><option value="*">All ADOMs</option></select>
  <select id="fdev" title="Managed device" hidden><option value="">All devices</option></select>
  <select id="vdom" title="VDOM (loaded from the selected FortiGate)"><option value="">VDOM…</option></select>
  <i class="sp"></i>
  <button id="all" class="pri" title="Run every check (uses cached results when available)"><span class="ic" data-i="play"></span> Run all</button>
  <button id="allLive" title="Re-query every check live from the devices and update the cache"><span class="ic" data-i="refresh"></span> Refresh all</button>
  <i class="sp"></i>
  <button id="collectPre" title="Collect every check and save it as the PRE-change snapshot (before the upgrade/change)"><span class="ic" data-i="download"></span> Snapshot <span class="tag pre">PRE</span></button>
  <button id="collectPost" title="Collect every check and save it as the POST-change snapshot (after the upgrade/change)"><span class="ic" data-i="download"></span> Snapshot <span class="tag post">POST</span></button>
  <button id="compare" title="Compare two snapshots, with pass/warn/fail verdicts"><span class="ic" data-i="compare"></span> Compare</button>
  <button id="sess" title="Fetch the session table of the selected FortiGate and validate it"><span class="ic" data-i="list"></span> Sessions</button>
</div>
<div class="layout">
<aside id="inv">
  <h2><span>Inventory</span><span id="invn" class="badge"></span></h2>
  <input id="iq" placeholder="Filter devices…">
  <div id="invlist"></div>
</aside>
<section>
  <div class="sec"><h2>Checks</h2><span class="hint">Click a tile to run it · Shift+click for live data</span></div>
  <div id="chips" class="chips"></div>
  <div id="cli" class="cli"></div>
  <div id="status" class="cli"></div>
  <div class="sec secgap"><h2>Results</h2></div>
  <div id="out"><div class="msg" data-idle>Pick a check above.</div></div>
</section>
</div>
<script src="/static/views.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
